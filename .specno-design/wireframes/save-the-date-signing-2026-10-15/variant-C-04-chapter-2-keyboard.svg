<text x="446.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Shot</text>
<text x="446.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">visualViewport drives it: the shot reframes to a strip on</text>
<text x="456.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">the shirt (top of the visual viewport, about 150 px here),</text>
<text x="456.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">so the guest watches the name land while typing. Makes</text>
<text x="456.0" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">leaves the frame for this shot only.</text>
<text x="446.0" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Panel</text>
<text x="446.0" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Fills the rest of the visual viewport (150 to 508). Scrolls</text>
<text x="456.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">the focused field into view (scroll-padding-block 6rem).</text>
<text x="456.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Focused: preferred name, 3px moonlight focus ring, group</text>
<text x="456.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">rule to 2px.</text>
<text x="446.0" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">World</text>
<text x="446.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Each new letter paints in over 150 ms after a 120 ms pause</text>
<text x="456.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">in typing. Barlow Condensed 700, white, warped to the shirt</text>
<text x="456.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">quad. Chips hidden while the keyboard is open (no room,</text>
<text x="456.0" y="301.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">nothing to do).</text>
<text x="446.0" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Messages → channel</text>
<text x="446.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">preferred-name label → type · the name on the shirt → world,</text>
<text x="456.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">mirroring the field · focus → ring + group rule</text>
<text x="446.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Reduced motion (T0)</text>
<text x="446.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Same strip, no paint-in; letters appear as typed.</text>
<text x="446.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Open</text>
<text x="446.0" y="424.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Keyboard height is a placeholder (336 px). Tune on a device</text>
<text x="456.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">in WhatsApp.</text>
