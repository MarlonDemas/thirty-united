<text x="446.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Shot</text>
<text x="446.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Two-shot: Makes and the hanging shirt in the slot to his</text>
<text x="456.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">right. Both faces of the beat (his smile, the shirt back)</text>
<text x="456.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">above the panel.</text>
<text x="446.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Panel</text>
<text x="446.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">43%, scrolls inside itself. The grouped fields as built:</text>
<text x="456.0" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">You, Plus one, Your team, A bit more, Contact. Each group:</text>
<text x="456.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">1px line top rule + caps legend, no four-sided box. Send my</text>
<text x="456.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">code at the end.</text>
<text x="446.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">World</text>
<text x="446.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Banks lit: 2 of 4 (Yes; Maybe holds bank 2 at half). The</text>
<text x="456.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">shirt swings in from the right (600 ms, no overshoot). The</text>
<text x="456.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">name letters onto its back as typed. Number area: ghost</text>
<text x="456.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">outline only. On Send my code: bank 3 strikes.</text>
<text x="446.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Messages → channel</text>
<text x="446.0" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">heading-your-shirt → type · group-* → position + caps legend</text>
<text x="456.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">· field labels → type above each field · optional → muted</text>
<text x="456.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">tag · send-my-code → icon + label (primary) · name on the</text>
<text x="456.0" y="367.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">shirt → the world (second channel; the field is the first)</text>
<text x="446.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">No path</text>
<text x="446.0" y="403.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">"Just your name" and email; Makes keeps waving; no shirt, no</text>
<text x="456.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">strike.</text>
<text x="446.0" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Reduced motion (T0)</text>
<text x="446.0" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">The shirt is already hanging; letters appear without the</text>
<text x="456.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">paint-in.</text>
