<text x="446.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Shot</text>
<text x="446.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Pushes toward the right floodlight head and its six lamps,</text>
<text x="456.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">with Makes still in frame (face upper left).</text>
<text x="446.0" y="127.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Panel</text>
<text x="446.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">43%. Check your email with the address (mono), six cells on</text>
<text x="456.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">one real input, resend with cooldown (secondary), Confirm</text>
<text x="456.0" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">code (primary), tries left, and the keep-this-page-open</text>
<text x="456.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">line.</text>
<text x="446.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">World</text>
<text x="446.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Banks lit: 3 of 4. The ground holds its breath: ambient</text>
<text x="456.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">stops, embers hang. One lamp per digit typed (80 ms, 4 ms</text>
<text x="456.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">haptic). Wrong code: all six out together (200 ms), error on</text>
<text x="456.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">the panel, [10, 30, 10]. Right code: lamps flare, bank 4</text>
<text x="456.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">strikes, finale.</text>
<text x="446.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Messages → channel</text>
<text x="446.0" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">heading-check-email → type · email-address → mono type +</text>
<text x="456.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">mail icon · digits → the input cells (lamps mirror them,</text>
<text x="456.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">never numerals) · cooldown → timer icon + countdown · error</text>
<text x="456.0" y="367.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">→ icon + status-error line + 2px rule · confirm-code → icon</text>
<text x="456.0" y="382.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">+ label (primary)</text>
<text x="446.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Leaving for email</text>
<text x="446.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Hidden tab: canvas stops and drops big textures; on return</text>
<text x="456.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">the still shows while it rebuilds.</text>
