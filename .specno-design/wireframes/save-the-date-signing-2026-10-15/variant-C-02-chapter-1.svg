<text x="456.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">(icon + word), Continue. Tile 1 shown selected: 2px</text>
<text x="456.0" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">moonlight edge, filled icon.</text>
<text x="446.0" y="193.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">World</text>
<text x="446.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Banks lit: 1 of 4 (from the tear). Answers on Continue,</text>
<text x="456.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">never on selection. Yes: bank 2 strikes, flags lift 6px,</text>
<text x="456.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">ember swirl. Maybe: bank 2 at half, moon halo dims. No: no</text>
<text x="456.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">strike, Makes cross-fades to the wave.</text>
<text x="446.0" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Messages → channel</text>
<text x="446.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">heading-are-you-in → type · yes / maybe / no → icon + word +</text>
<text x="456.0" y="307.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">selected edge (not colour alone) · continue → icon + label</text>
<text x="456.0" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">(primary) · world reaction → light, announced in the live</text>
<text x="456.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">region</text>
<text x="446.0" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000" text-anchor="start" font-weight="bold">Reduced motion (T0)</text>
<text x="446.0" y="373.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">Bank 2 appears lit (or half) at once; the pose swaps without</text>
<text x="456.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="start" font-weight="normal">a fade.</text>
