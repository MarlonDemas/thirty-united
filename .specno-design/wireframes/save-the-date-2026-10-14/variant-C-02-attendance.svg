<text x="12" y="1000" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333" font-weight="700" text-anchor="start">Hypothesis: after the tear the ticket becomes a header and its torn stub previews the pick, so the choice is visible on the object.</text>
<text x="12" y="1017" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Anchors: Mundial desktop (ruled 1px boxes), Paperless Post (invite as a physical object), Premier League (tabular numerals) from references/rsvp-save-the-date-sports-ticket-2026-10-14.md.</text>
<text x="12" y="1034" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Commitments: three equal tiles in a row at every width (56px+ targets); selection = ink fill + filled icon + name; one ruled box; heading takes focus on arrival.</text>
<text x="12" y="1051" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Channels: options by icon + position; selected by fill + icon change + stub preview; Continue = red action with arrow icon.</text>
