<text x="12" y="1000" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333" font-weight="700" text-anchor="start">Hypothesis: one object, one action. The ticket is the largest thing on the page; the only red is the Tear open button.</text>
<text x="12" y="1017" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Anchors: Mundial desktop (ruled 1px boxes), Paperless Post (invite as a physical object), Premier League (tabular numerals) from references/rsvp-save-the-date-sports-ticket-2026-10-14.md.</text>
<text x="12" y="1034" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Commitments: ticket never wider than 960 and sized by content (grows at 200% text); perforation is cut-outs; drag handle on the line AND a real button; reduced motion = button only, instant swap.</text>
<text x="12" y="1051" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Channels: date/title by type; venue by icon + muted type; next step by icon + short label on the one red action; tear result by motion, announced by a live region.</text>
</svg>