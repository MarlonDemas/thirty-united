<text x="12" y="1060" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333" font-weight="700" text-anchor="start">Hypothesis: the stub is the reward, so it reuses the ticket (same frame, same perforation) filled in, with the one red stamp.</text>
<text x="12" y="1077" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Anchors: Mundial desktop (ruled 1px boxes), Paperless Post (invite as a physical object), Premier League (tabular numerals) from references/rsvp-save-the-date-sports-ticket-2026-10-14.md.</text>
<text x="12" y="1094" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Commitments: stamp overlaps the perforation, rotated -4 degrees, 1px inner rule; data in a ruled mono table; long names wrap in the name row and the ticket grows taller; Maybe = outlined stamp + icon + MAYBE tag.</text>
<text x="12" y="1111" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="start">Mobile: the ruled table moves under the ticket so the ticket stays landscape and readable at 390.</text>
</svg>