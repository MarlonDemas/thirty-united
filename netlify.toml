[build]
  command = "npx convex deploy --cmd 'pnpm build'"
  publish = "dist"

# Previews (PR deploy previews and branch deploys) build the frontend only, without `convex deploy`,
# and use the production Convex backend (public URL, not a secret). RSVPs submitted on a preview are
# real production writes. CONVEX_DEPLOY_KEY stays Production-scoped in the Netlify UI.
# VITE_DEBUG_PROBE enables the ?debug=1 device probe on preview builds only; production builds drop the probe.
[context.deploy-preview]
  command = "pnpm build"

[context.deploy-preview.environment]
  VITE_CONVEX_URL = "https://incredible-crane-757.convex.cloud"
  VITE_DEBUG_PROBE = "1"

[context.branch-deploy]
  command = "pnpm build"

[context.branch-deploy.environment]
  VITE_CONVEX_URL = "https://incredible-crane-757.convex.cloud"
  VITE_DEBUG_PROBE = "1"

# Missing /assets/* files (stale chunks after a deploy) must 404, not fall through to index.html with a 200 under an immutable cache header.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
