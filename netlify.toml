[build]
  command = "npx convex deploy --cmd 'pnpm build'"
  publish = "dist"

# Preview of feature/3d-ticket only: frontend build, no `convex deploy`.
# Points at the existing production Convex backend (public URL, not a secret).
# CONVEX_DEPLOY_KEY is Production-scoped in the Netlify UI and must stay that way.
[context."feature/3d-ticket"]
  command = "pnpm build"

[context."feature/3d-ticket".environment]
  VITE_CONVEX_URL = "https://incredible-crane-757.convex.cloud"

# Preview of fix/debug-gate-assets-404 only: frontend build, no `convex deploy`.
# Same public production Convex URL as above; the probe flag is preview-only.
[context."fix/debug-gate-assets-404"]
  command = "pnpm build"

[context."fix/debug-gate-assets-404".environment]
  VITE_CONVEX_URL = "https://incredible-crane-757.convex.cloud"
  VITE_DEBUG_PROBE = "1"

# VITE_DEBUG_PROBE enables the ?debug=1 device probe on preview builds only; production builds drop the probe.
[context.deploy-preview.environment]
  VITE_DEBUG_PROBE = "1"

[context.branch-deploy.environment]
  VITE_DEBUG_PROBE = "1"

# Missing /assets/* files (stale chunks after a deploy) must 404, not fall through to index.html with a 200 under an immutable cache header.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
