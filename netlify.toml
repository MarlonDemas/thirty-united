[build]
  command = "npx convex deploy --cmd 'pnpm build'"
  publish = "dist"

# Previews (PR deploy previews and branch deploys) build the frontend only, without `convex deploy`,
# and use the separate "previews" dev Convex deployment (modest-marten-55, mock mail, its own INVITE_KEY),
# so RSVPs on a preview never reach production. CONVEX_DEPLOY_KEY stays Production-scoped in the Netlify UI.
[context.deploy-preview]
  command = "pnpm build"

[context.deploy-preview.environment]
  VITE_CONVEX_URL = "https://modest-marten-55.convex.cloud"

[context.branch-deploy]
  command = "pnpm build"

[context.branch-deploy.environment]
  VITE_CONVEX_URL = "https://modest-marten-55.convex.cloud"

# Missing /assets/* files (stale chunks after a deploy) must 404, not fall through to index.html with a 200 under an immutable cache header.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# Same for /world/* (HDR, textures, model, font): a missing file must not come back as index.html.
[[redirects]]
  from = "/world/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://incredible-crane-757.convex.cloud https://modest-marten-55.convex.cloud; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /world/* are unhashed statics (HDR, textures, model, font), so a day of caching, not immutable.
[[headers]]
  for = "/world/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
